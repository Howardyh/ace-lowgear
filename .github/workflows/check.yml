name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect public source
        run: .\tools\Test-PublicContent.ps1 -CheckIndex
      - name: Test isolated registry transactions and startup behavior
        run: .\tools\Test-Project.ps1 -StartupProbe
      - name: Verify source packaging
        run: .\tools\Package.ps1
